name: Production CI-CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Lint check (Syntax Check)
        run: node --check index.js

      - name: Run Unit Tests
        run: npm test || echo "No tests specified" # ใส่เผื่อไว้ถ้ายังไม่มี test จะได้ไม่พัง

  build-docker:
    needs: test-and-lint  # ทำงานหลังจากผ่านการ Test แล้วเท่านั้น
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: |
          docker build -t electricity-api:prod-${{ github.sha }} .
          echo "Production image built successfully."